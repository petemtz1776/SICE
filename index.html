<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>Camera Stamp</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
  overflow: hidden;
}


/*====================================================
 CONTENEDOR PRINCIPAL
====================================================*/

#cameraContainer {

  width: 100%;
  max-width: 800px;

  height: 100dvh;

  margin: 0 auto;

  position: relative;

  background: #000;

  overflow: hidden;
}


/*====================================================
 VIDEO
====================================================*/

#video {

  position: absolute;

  left: 0;
  top: 0;

  width: 100%;
  height: 100%;

  display: block;

  background: #000;

  object-fit: cover;
}


/*====================================================
 CANVAS OCULTO
====================================================*/

#canvas {
  display: none;
}


/*====================================================
 VISOR DE SEÑALAMIENTO
====================================================*/

#arrowEditor {

  display: none;

  position: absolute;

  left: 0;
  top: 0;
  right: 0;
  bottom: 0;

  background: #000;

  z-index: 5;

  overflow: hidden;
}


#arrowCanvas {

  width: 100%;
  height: 100%;

  display: block;

  background: #000;

  cursor: crosshair;

  touch-action: none;
}


/*====================================================
 PANEL PLOMADO
====================================================*/

#plomadoOverlay {

  display: none;

  position: absolute;

  left: 0;
  top: 0;
  right: 0;
  bottom: 0;

  background: rgba(0,0,0,.92);

  z-index: 20;

  align-items: center;
  justify-content: center;

  flex-direction: column;

  padding:
    12px;

  overflow: hidden;
}


#plomadoCanvas {

  width: 100%;
  max-width: 700px;

  height: auto;

  display: block;

  touch-action: none;
}


#plomadoHUD {

  color: #fff;

  font-size: 23px;

  font-weight: bold;

  text-align: center;

  margin:
    8px 0;

  min-height: 30px;
}


#plomadoControls {

  display: flex;

  align-items: center;
  justify-content: center;

  gap: 8px;

  flex-wrap: wrap;

  margin-top: 5px;
}


#plomadoControls button {

  min-width: 120px;

  min-height: 48px;

  padding:
    10px 14px;

  border: none;

  border-radius: 8px;

  font-size: 14px;

  font-weight: bold;

  color: #fff;

  cursor: pointer;

  touch-action: manipulation;
}


#plomadoConfirmButton {
  background: #4caf50;
}


#plomadoCancelButton {
  background: #f44336;
}


/*====================================================
 PANEL MEDICIÓN
====================================================*/

#medicionOverlay {

  display: none;

  position: absolute;

  left: 0;
  top: 0;
  right: 0;
  bottom: 0;

  background: #000;

  z-index: 30;

  flex-direction: column;

  overflow: hidden;
}


#medicionInstruccion {

  flex: 0 0 auto;

  color: #fff;

  background: #111;

  padding:
    10px;

  text-align: center;

  font-size: 17px;

  font-weight: bold;

  min-height: 44px;
}


#medicionCanvasContainer {

  flex: 1 1 auto;

  min-height: 0;

  display: flex;

  align-items: center;
  justify-content: center;

  overflow: hidden;

  background: #000;
}


#medicionCanvas {

  max-width: 100%;
  max-height: 100%;

  width: auto;
  height: auto;

  display: block;

  touch-action: none;

  background: #000;
}


#medicionControls {

  flex: 0 0 auto;

  display: flex;

  align-items: center;
  justify-content: center;

  gap: 6px;

  flex-wrap: wrap;

  background: #111;

  padding:
    8px;

  padding-bottom:
    calc(
      8px +
      env(safe-area-inset-bottom)
    );
}


#medicionControls button {

  min-width: 90px;

  min-height: 46px;

  padding:
    9px 12px;

  border: none;

  border-radius: 8px;

  font-size: 13px;

  font-weight: bold;

  color: #fff;

  cursor: pointer;

  touch-action: manipulation;
}


#medicionUndoButton {
  background: #ff9800;
}


#medicionFinishButton {
  background: #4caf50;
}


#medicionCancelButton {
  background: #f44336;
}


/*====================================================
 CONTROLES
====================================================*/

#cameraControls {

  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  min-height: 76px;

  display: flex;

  align-items: center;
  justify-content: center;

  gap: 8px;

  padding:
    10px
    8px
    calc(
      10px +
      env(safe-area-inset-bottom)
    );

  background:
    linear-gradient(
      transparent 0%,
      rgba(0,0,0,.80) 35%,
      rgba(0,0,0,.95) 100%
    );

  z-index: 100;
}


/*====================================================
 BOTONES
====================================================*/

#cameraControls button {

  flex: 0 1 auto;

  min-width: 72px;

  min-height: 48px;

  padding:
    10px 12px;

  font-size: 13px;

  font-weight: bold;

  border: none;

  border-radius: 8px;

  cursor: pointer;

  white-space: nowrap;

  -webkit-tap-highlight-color: transparent;

  touch-action: manipulation;
}


#cameraControls button:disabled {
  opacity: .4;
}


/*====================================================
 COLORES
====================================================*/

#startButton {
  background: #2196f3;
  color: #fff;
}

#takeButton {
  background: #4caf50;
  color: #fff;
}

#signalButton {
  background: #ff9800;
  color: #fff;
}

#signalButton.active {
  background: #e65100;

  box-shadow:
    0 0 0 3px
    rgba(255,152,0,.35);
}

#confirmButton {
  background: #4caf50;
  color: #fff;

  display: none;
}

#cancelSignalButton {
  background: #f44336;
  color: #fff;

  display: none;
}

#cancelButton {
  background: #f44336;
  color: #fff;
}


/*====================================================
 PREVIEW
====================================================*/

#preview {

  width: 100%;

  max-width: 800px;

  display: none;

  margin: auto;
}


/*====================================================
 STATUS
====================================================*/

#status {
  display: none;
}


/*====================================================
 CELULARES
====================================================*/

@media (max-width: 600px) {

  #cameraContainer {

    width: 100vw;

    height: 100dvh;

    max-width: none;
  }


  #video {

    width: 100vw;
    height: 100%;

    object-fit: cover;
  }


  #arrowEditor {

    width: 100%;
    height: 100%;
  }


  #arrowCanvas {

    width: 100%;
    height: 100%;

    touch-action: none;
  }


  #cameraControls {

    min-height: 82px;

    gap: 6px;

    padding:

      6px
      calc(

  }


  #cameraControls button {

    min-width: 70px;

    min-height: 50px;

    padding:
      9px 10px;

    font-size: 12px;

    border-radius: 8px;
  }

  }

    min-height: 46px;

/*====================================================

====================================================*/

@media (max-width: 380px) {

  }

  }

    min-width: 95px;

<script>


/*====================================================
 DATOS DEL FORMULARIO
====================================================*/

const params =
  new URLSearchParams(
    window.location.search
  );


const tipo =
  params.get("tipo") || "poste";


let modo =
  params.get("modo") || "normal";


const proyecto =
  params.get("proyecto") || "";


const tipoProyecto =
  params.get("tipoProyecto") || "";


const hub =
  params.get("hub") || "";


const rama =
  params.get("rama") || "";



/*====================================================
 DETERMINAR MODO AUTOMÁTICAMENTE
====================================================*/

if (
  String(tipo)
    .trim()
    .toUpperCase() ===
  "MEDIR POSTE"
) {

  modo = "medir";

}


if (
  String(tipo)
    .trim()
    .toUpperCase() ===
  "PLOMADO POSTE"
) {

  modo = "plomado";

}



/*====================================================
 LOGO
====================================================*/

const LOGO_DRIVE_ID =
  "12EpwDn_A9mR0DfZSiGoTi2NS9zFNYPVP";


const LOGO_URL =
  "https://lh3.googleusercontent.com/d/" +
  LOGO_DRIVE_ID;


const LOGO_URL_ALTERNATIVO =
  "https://drive.google.com/uc?export=view&id=" +
  LOGO_DRIVE_ID;



/*====================================================
 ELEMENTOS
====================================================*/

const video =
  document.getElementById("video");


const canvas =
  document.getElementById("canvas");


const preview =
  document.getElementById("preview");


const startButton =
  document.getElementById("startButton");


const signalButton =
  document.getElementById("signalButton");


const takeButton =
  document.getElementById("takeButton");


const confirmButton =
  document.getElementById("confirmButton");


const cancelSignalButton =
  document.getElementById(
    "cancelSignalButton"
  );


const cancelButton =
  document.getElementById("cancelButton");


const status =
  document.getElementById("status");


const arrowEditor =
  document.getElementById(
    "arrowEditor"
  );


const arrowCanvas =
  document.getElementById(
    "arrowCanvas"
  );


const plomadoOverlay =
  document.getElementById(
    "plomadoOverlay"
  );


const plomadoCanvas =
  document.getElementById(
    "plomadoCanvas"
  );


const plomadoHUD =
  document.getElementById(
    "plomadoHUD"
  );


const plomadoConfirmButton =
  document.getElementById(
    "plomadoConfirmButton"
  );


const plomadoCancelButton =
  document.getElementById(
    "plomadoCancelButton"
  );


const medicionOverlay =
  document.getElementById(
    "medicionOverlay"
  );


const medicionCanvas =
  document.getElementById(
    "medicionCanvas"
  );


const medicionInstruccion =
  document.getElementById(
    "medicionInstruccion"
  );


const medicionUndoButton =
  document.getElementById(
    "medicionUndoButton"
  );


const medicionFinishButton =
  document.getElementById(
    "medicionFinishButton"
  );


const medicionCancelButton =
  document.getElementById(
    "medicionCancelButton"
  );



/*====================================================
 VARIABLES
====================================================*/

let stream = null;

let modoSenalar = false;

let fotoBase = null;

let gpsActual = null;

let ultimaPosicionGPS = null;

let fechaFoto = null;

let logoImagen = null;

let logoListo = false;

let zonaLogo = null;

let zonaEstampado = null;



/*====================================================
 VARIABLES DE FLECHA
====================================================*/

let flechaX = null;

let flechaY = null;

let flechaAngulo = 0;

let flechaEscala = 1;

let gestoActivo = false;

let toqueInicial = null;

let ultimoToque = 0;



/*====================================================
 VARIABLES PLOMADO
====================================================*/

let sensoresActivos = false;

let gravity = {

  x: 0,

  y: 0,

  z: 0

};


let plomadoActivo = false;

let plomadoGrados = 0;



/*====================================================
 VARIABLES MEDICIÓN
====================================================*/

let referenceReal = null;


let measurePoints = {

  r1: null,

  r2: null,

  base: null,

  punta: null

};


let measureStep = "r1";

let resultadoMedicion = null;



/*====================================================
 INICIAR CÁMARA
====================================================*/

startButton.addEventListener(
  "click",
  iniciarCamara
);


async function iniciarCamara(){

  try{

    status.textContent =
      "Solicitando permiso de cámara...";


    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "El navegador no permite utilizar la cámara."
      );

    }


    detenerCamara();


    stream =
      await navigator.mediaDevices.getUserMedia({

        video:{

          facingMode:{
            ideal:"environment"
          },

          width:{
            ideal:1920
          },

          height:{
            ideal:1080
          }

        },

        audio:false

      });


    video.srcObject =
      stream;


    await video.play();


    startButton.style.display =
      "none";


    signalButton.style.display =
      "block";


    takeButton.disabled =
      false;


    cargarLogo();


    status.textContent =
      "✅ CÁMARA LISTA.";


    if(modo === "plomado"){

      iniciarSensores();

      plomadoActivo =
        true;

      plomadoOverlay.style.display =
        "flex";

      actualizarPlomado();

    }

  }
  catch(error){

    console.error(
      "ERROR CAMERA:",
      error
    );


    status.textContent =
      "NO FUE POSIBLE ABRIR LA CÁMARA.\n\n" +
      error.name +
      "\n" +
      error.message;


    startButton.style.display =
      "block";


    takeButton.disabled =
      true;

  }

}



/*====================================================
 CARGAR LOGO
====================================================*/

function cargarLogo(){

  logoListo =
    false;


  logoImagen =
    new Image();


  logoImagen.crossOrigin =
    "anonymous";


  logoImagen.onload =
    function(){

      logoListo =
        true;


      console.log(
        "LOGO CARGADO:",
        logoImagen.width,
        logoImagen.height
      );


      status.textContent =
        "✅ Cámara y logo listos.";

    };


  logoImagen.onerror =
    function(){

      console.warn(
        "No se pudo cargar logo principal."
      );


      const alternativa =
        new Image();


      alternativa.crossOrigin =
        "anonymous";


      alternativa.onload =
        function(){

          logoImagen =
            alternativa;

          logoListo =
            true;


          console.log(
            "LOGO CARGADO CON URL ALTERNATIVA"
          );

        };


      alternativa.onerror =
        function(){

          logoListo =
            false;

          console.error(
            "NO SE PUDO CARGAR EL LOGO."
          );

        };


      alternativa.src =
        LOGO_URL_ALTERNATIVO;

    };


  logoImagen.src =
    LOGO_URL;

}



/*====================================================
 BOTÓN SEÑALAR
====================================================*/

signalButton.addEventListener(
  "click",
  function(){

    modoSenalar =
      !modoSenalar;


    if(modoSenalar){

      signalButton.classList.add(
        "active"
      );


      signalButton.textContent =
        "🎯 ACTIVO";


      status.textContent =
        "🎯 SEÑALAR ACTIVADO.\n\n" +
        "Toma la fotografía.";

    }
    else{

      desactivarSenalar();

    }

  }
);



/*====================================================
 DESACTIVAR SEÑALAR
====================================================*/

function desactivarSenalar(){

  modoSenalar =
    false;


  signalButton.classList.remove(
    "active"
  );


  signalButton.textContent =
    "🎯 SEÑALAR";

}



/*====================================================
 CAPTURA BASE
====================================================*/

function capturaBase(){

  const width =
    video.videoWidth;

  const height =
    video.videoHeight;


  if(
    !width ||
    !height
  ){

    throw new Error(
      "La cámara todavía no está lista."
    );

  }


  canvas.width =
    width;

  canvas.height =
    height;


  const ctx =
    canvas.getContext("2d");


  ctx.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  return ctx;

}



/*====================================================
 ESTAMPADO
====================================================*/

function dibujarEstampado(
  ctx,
  width,
  height,
  lineasExtra = []
){

  const escala =
    Math.max(
      width,
      height
    ) / 1200;


  const padding =
    Math.round(
      16 * escala
    );


  const font =
    Math.max(
      16,
      Math.round(
        20 * escala
      )
    );


  const altoLinea =
    Math.round(
      27 * escala
    );


  const lineas = [

    "PROYECTO: " +
      (
        proyecto ||
        "SIN PROYECTO"
      ),

    "TIPO PROYECTO: " +
      (
        tipoProyecto ||
        "SIN TIPO"
      ),

    "TIPO FOTO: " +
      obtenerNombreTipoFoto(tipo),

    fechaFoto
      ? fechaFoto.toLocaleDateString(
          "es-MX"
        ) +
        "  " +
        fechaFoto.toLocaleTimeString(
          "es-MX"
        )
      : new Date().toLocaleDateString(
          "es-MX"
        ) +
        "  " +
        new Date().toLocaleTimeString(
          "es-MX"
        ),

    gpsActual

      ? "LAT: " +
        Number(
          gpsActual.lat
        ).toFixed(6) +

        "  LON: " +

        Number(
          gpsActual.lng
        ).toFixed(6)

      : "GPS: SIN UBICACIÓN"

  ];


  if(
    Array.isArray(lineasExtra) &&
    lineasExtra.length
  ){

    lineas.push(
      ...lineasExtra
    );

  }


  ctx.font =
    "bold " +
    font +
    "px Arial";


  let anchoTexto =
    0;


  lineas.forEach(
    function(texto){

      const medida =
        ctx.measureText(
          texto
        ).width;


      if(
        medida >
        anchoTexto
      ){

        anchoTexto =
          medida;

      }

    }
  );


  const anchoCaja =
    anchoTexto +
    padding * 2;


  const altoCaja =
    lineas.length *
      altoLinea +
    padding * 2;


  const x =
    padding;


  const y =
    height -
    altoCaja -
    padding;


  const margenEstampado =
    Math.max(
      15,
      Math.round(
        18 * escala
      )
    );


  zonaEstampado = {

    x:
      x -
      margenEstampado,

    y:
      y -
      margenEstampado,

    width:
      anchoCaja +
      margenEstampado * 2,

    height:
      altoCaja +
      margenEstampado * 2

  };


  ctx.fillStyle =
    "rgba(0,0,0,.42)";


  ctx.beginPath();


  const radio =
    Math.round(
      10 * escala
    );


  ctx.roundRect(
    x,
    y,
    anchoCaja,
    altoCaja,
    radio
  );


  ctx.fill();


  ctx.fillStyle =
    "rgba(255,255,255,.95)";


  ctx.font =
    "bold " +
    font +
    "px Arial";


  ctx.textBaseline =
    "top";


  lineas.forEach(
    function(texto,index){

      ctx.fillText(

        texto,

        x + padding,

        y +
        padding +
        index *
        altoLinea

      );

    }
  );

}



/*====================================================
 TOMAR FOTO
====================================================*/

takeButton.addEventListener(
  "click",
  tomarFoto
);


async function tomarFoto(){

  try{

    if(!stream){

      throw new Error(
        "La cámara no está iniciada."
      );

    }


    status.textContent =
      "Obteniendo ubicación GPS...";


    const posicion =
      await obtenerGPS();


    gpsActual =
      posicion;


    ultimaPosicionGPS =
      posicion;


    /*==================================================
      MODO PLOMADO
    ==================================================*/

    if(modo === "plomado"){

      plomadoActivo =
        true;


      plomadoOverlay.style.display =
        "flex";


      actualizarPlomado();


      return;

    }


    /*==================================================
      MODO MEDIR
    ==================================================*/

    if(modo === "medir"){

      const valor =
        prompt(
          "Escribe la medida REAL del objeto de referencia en metros:"
        );


      if(valor === null){

        return;

      }


      const numero =
        Number(
          String(valor)
            .replace(",", ".")
        );


      if(
        !Number.isFinite(numero) ||
        numero <= 0
      ){

        alert(
          "La medida debe ser mayor que cero."
        );

        return;

      }


      referenceReal =
        numero;


      fechaFoto =
        new Date();


      const ctx =
        capturaBase();


      dibujarEstampado(
        ctx,
        canvas.width,
        canvas.height
      );


      dibujarLogoEnCanvas(
        ctx,
        canvas.width,
        canvas.height
      );


      fotoBase =
        canvas.toDataURL(
          "image/jpeg",
          0.90
        );


      abrirEditorMedicion();


      return;

    }


    /*==================================================
      MODO NORMAL
    ==================================================*/

    const width =
      video.videoWidth;


    const height =
      video.videoHeight;


    if(
      !width ||
      !height
    ){

      throw new Error(
        "La cámara todavía no está lista."
      );

    }


    canvas.width =
      width;


    canvas.height =
      height;


    const ctx =
      canvas.getContext("2d");


    ctx.drawImage(
      video,
      0,
      0,
      width,
      height
    );


    const ahora =
      new Date();


    fechaFoto =
      ahora;


    dibujarEstampado(
      ctx,
      width,
      height
    );


    dibujarLogoEnCanvas(
      ctx,
      width,
      height
    );


    fotoBase =
      canvas.toDataURL(
        "image/jpeg",
        0.90
      );


    if(!modoSenalar){

      enviarFotoFinal(
        fotoBase,
        ahora,
        posicion
      );

      return;

    }


    abrirVisorFlecha();

  }
  catch(error){

    console.error(
      "ERROR TOMANDO FOTO:",
      error
    );


    status.textContent =
      "ERROR AL TOMAR FOTO:\n\n" +
      error.message;

  }

}



/*====================================================
 DIBUJAR LOGO
====================================================*/

function dibujarLogoEnCanvas(
  ctx,
  width,
  height
){

  if(
    !logoListo ||
    !logoImagen
  ){

    zonaLogo =
      null;

    return;

  }


  const maxWidth =
    width * 0.18;


  const maxHeight =
    height * 0.14;


  const proporcion =
    Math.min(

      maxWidth /
      logoImagen.width,

      maxHeight /
      logoImagen.height

    );


  const logoWidth =
    logoImagen.width *
    proporcion;


  const logoHeight =
    logoImagen.height *
    proporcion;


  const margen =
    Math.max(
      20,
      Math.round(
        width * 0.025
      )
    );


  const logoX =
    width -
    logoWidth -
    margen;


  const logoY =
    margen;


  const bloqueo =
    Math.max(
      15,
      Math.round(
        width * 0.012
      )
    );


  zonaLogo = {

    x:
      logoX -
      bloqueo,

    y:
      logoY -
      bloqueo,

    width:
      logoWidth +
      bloqueo * 2,

    height:
      logoHeight +
      bloqueo * 2

  };


  ctx.save();


  ctx.fillStyle =
    "rgba(0,0,0,.20)";


  ctx.fillRect(

    logoX -
    5,

    logoY -
    5,

    logoWidth +
    10,

    logoHeight +
    10

  );


  ctx.drawImage(

    logoImagen,

    logoX,

    logoY,

    logoWidth,

    logoHeight

  );


  ctx.restore();


  console.log(
    "ZONA LOGO BLOQUEADA:",
    zonaLogo
  );

}

/*====================================================
 OBTENER PUNTO DEL EVENTO
====================================================*/

function obtenerPuntoEvento(
  event
){

  const rect =
    arrowCanvas.getBoundingClientRect();


  const escalaX =
    arrowCanvas.width /
    rect.width;


  const escalaY =
    arrowCanvas.height /
    rect.height;


  return {

    x:
      (
        event.clientX -
        rect.left
      ) *
      escalaX,

    y:
      (
        event.clientY -
        rect.top
      ) *
      escalaY

  };

}

/*====================================================
 TOUCH START
====================================================*/

arrowCanvas.addEventListener(
  "touchstart",
  function(event){

    event.preventDefault();


    ultimoToque =
      Date.now();


    const touches =
      event.touches;


    if(
      touches.length === 1
    ){

      const punto =
        obtenerPuntoEvento(
          touches[0]
        );


      if(
        flechaX === null
      ){

        if(
          flechaChocaConZonas(
            punto.x,
            punto.y,
            0,
            1
          )
        ){

          alert(
            "🚫 La flecha no puede colocarse sobre el logo ni sobre el estampado."
          );

          return;

        }


        flechaX =
          punto.x;


        flechaY =
          punto.y;


        flechaAngulo =
          0;


        flechaEscala =
          1;


        dibujarFlecha();

      }


      gestoActivo =
        true;


      toqueInicial = {

        tipo:
          "move",

        x:
          punto.x,

        y:
          punto.y,

        flechaX:
          flechaX,

        flechaY:
          flechaY

      };

    }


    else if(
      touches.length === 2 &&
      flechaX !== null
    ){

      gestoActivo =
        true;


      const p1 =
        obtenerPuntoEvento(
          touches[0]
        );


      const p2 =
        obtenerPuntoEvento(
          touches[1]
        );


      const centroX =
        (
          p1.x +
          p2.x
        ) / 2;


      const centroY =
        (
          p1.y +
          p2.y
        ) / 2;


      const distancia =
        Math.hypot(

          p2.x -
          p1.x,

          p2.y -
          p1.y

        );


      const angulo =
        Math.atan2(

          p2.y -
          p1.y,

          p2.x -
          p1.x

        );


      toqueInicial = {

        tipo:
          "transform",

        centroX:
          centroX,

        centroY:
          centroY,

        distancia:
          distancia,

        angulo:
          angulo,

        flechaX:
          flechaX,

        flechaY:
          flechaY,

        escala:
          flechaEscala,

        rotacion:
          flechaAngulo

      };

    }

  },
  {
    passive:false
  }
);



/*====================================================
 TOUCH MOVE
====================================================*/

arrowCanvas.addEventListener(
  "touchmove",
  function(event){

    event.preventDefault();


    if(
      !gestoActivo ||
      !toqueInicial
    ){

      return;

    }


    const touches =
      event.touches;


    if(
      touches.length === 1 &&
      toqueInicial.tipo === "move"
    ){

      const punto =
        obtenerPuntoEvento(
          touches[0]
        );


      const dx =
        punto.x -
        toqueInicial.x;


      const dy =
        punto.y -
        toqueInicial.y;


      const nuevoX =
        toqueInicial.flechaX +
        dx;


      const nuevoY =
        toqueInicial.flechaY +
        dy;


      if(
        !flechaChocaConZonas(
          nuevoX,
          nuevoY,
          flechaAngulo,
          flechaEscala
        )
      ){

        flechaX =
          nuevoX;


        flechaY =
          nuevoY;


        dibujarFlecha();

      }

    }


    else if(
      touches.length === 2 &&
      toqueInicial.tipo ===
        "transform"
    ){

      const p1 =
        obtenerPuntoEvento(
          touches[0]
        );


      const p2 =
        obtenerPuntoEvento(
          touches[1]
        );


      const centroX =
        (
          p1.x +
          p2.x
        ) / 2;


      const centroY =
        (
          p1.y +
          p2.y
        ) / 2;


      const distancia =
        Math.hypot(

          p2.x -
          p1.x,

          p2.y -
          p1.y

        );


      const angulo =
        Math.atan2(

          p2.y -
          p1.y,

          p2.x -
          p1.x

        );


      let nuevaEscala =
        toqueInicial.escala *
        (
          distancia /
          toqueInicial.distancia
        );


      nuevaEscala =
        Math.max(
          0.35,
          Math.min(
            3,
            nuevaEscala
          )
        );


      const nuevaRotacion =
        toqueInicial.rotacion +
        (
          angulo -
          toqueInicial.angulo
        );


      if(
        !flechaChocaConZonas(
          toqueInicial.flechaX,
          toqueInicial.flechaY,
          nuevaRotacion,
          nuevaEscala
        )
      ){

        flechaAngulo =
          nuevaRotacion;


        flechaEscala =
          nuevaEscala;


        dibujarFlecha();

      }

    }

  },
  {
    passive:false
  }
);

/*====================================================
 COMPROBAR ZONAS PROHIBIDAS
====================================================*/

function flechaChocaConZonas(
  x,
  y,
  angulo,
  escala
){

  const factor =
    Math.max(
      arrowCanvas.width,
      arrowCanvas.height
    ) / 1200;


  const longitud =
    150 *
    factor *
    escala;


  const grosor =
    Math.max(
      8,
      9 *
      factor *
      escala
    );


  const inicioX =
    x -
    longitud *
    Math.cos(
      angulo +
      Math.PI / 4
    );


  const inicioY =
    y -
    longitud *
    Math.sin(
      angulo +
      Math.PI / 4
    );


  const pasos =
    18;


  for(
    let i = 0;
    i <= pasos;
    i++
  ){

    const t =
      i / pasos;


    const px =
      inicioX +
      (
        x -
        inicioX
      ) *
      t;


    const py =
      inicioY +
      (
        y -
        inicioY
      ) *
      t;


    const margen =
      grosor *
      1.8;


    const puntos = [

      {
        x:px,
        y:py
      },

      {
        x:px + margen,
        y:py
      },

      {
        x:px - margen,
        y:py
      },

      {
        x:px,
        y:py + margen
      },

      {
        x:px,
        y:py - margen
      }

    ];


    for(
      const punto of puntos
    ){

      if(
        puntoEnRectangulo(
          punto.x,
          punto.y,
          zonaEstampado
        )
      ){

        return true;

      }


      if(
        puntoEnRectangulo(
          punto.x,
          punto.y,
          zonaLogo
        )
      ){

        return true;

      }

    }

  }


  const punta =
    32 *
    factor *
    escala;


  const cabezaPuntos = [

    {
      x:x,
      y:y
    },

    {
      x:x + punta,
      y:y
    },

    {
      x:x - punta,
      y:y
    },

    {
      x:x,
      y:y + punta
    },

    {
      x:x,
      y:y - punta
    }

  ];


  for(
    const punto of cabezaPuntos
  ){

    if(
      puntoEnRectangulo(
        punto.x,
        punto.y,
        zonaEstampado
      )
    ){

      return true;

    }


    if(
      puntoEnRectangulo(
        punto.x,
        punto.y,
        zonaLogo
      )
    ){

      return true;

    }

  }


  return false;

}



/*====================================================
 PUNTO EN RECTANGULO
====================================================*/

function puntoEnRectangulo(
  x,
  y,
  rect
){

  if(!rect){

    return false;

  }


  return (

    x >= rect.x &&

    x <=
      rect.x +
      rect.width &&

    y >= rect.y &&

    y <=
      rect.y +
      rect.height

  );

}



/*====================================================
 DIBUJAR FLECHA
====================================================*/

function dibujarFlecha(){

  if(
    flechaX === null ||
    flechaY === null
  ){

    return;

  }


  const imagen =
    new Image();


  imagen.onload =
    function(){

      const ctx =
        arrowCanvas.getContext(
          "2d"
        );


      ctx.clearRect(

        0,
        0,

        arrowCanvas.width,
        arrowCanvas.height

      );


      ctx.drawImage(

        imagen,

        0,
        0

      );


      const factor =
        Math.max(

          arrowCanvas.width,

          arrowCanvas.height

        ) / 1200;


      const longitud =
        150 *
        factor *
        flechaEscala;


      const punta =
        32 *
        factor *
        flechaEscala;


      const inicioX =
        flechaX -
        longitud *
        Math.cos(
          flechaAngulo +
          Math.PI / 4
        );


      const inicioY =
        flechaY -
        longitud *
        Math.sin(
          flechaAngulo +
          Math.PI / 4
        );


      ctx.beginPath();


      ctx.moveTo(
        inicioX,
        inicioY
      );


      ctx.lineTo(
        flechaX,
        flechaY
      );


      ctx.strokeStyle =
        "#000000";


      ctx.lineWidth =
        Math.max(
          12,
          13 *
          factor *
          flechaEscala
        );


      ctx.lineCap =
        "round";


      ctx.stroke();


      ctx.beginPath();


      ctx.moveTo(
        inicioX,
        inicioY
      );


      ctx.lineTo(
        flechaX,
        flechaY
      );


      ctx.strokeStyle =
        "#00ff00";


      ctx.lineWidth =
        Math.max(
          7,
          9 *
          factor *
          flechaEscala
        );


      ctx.lineCap =
        "round";


      ctx.stroke();


      const angulo =
        Math.atan2(

          flechaY -
          inicioY,

          flechaX -
          inicioX

        );


      ctx.beginPath();


      ctx.moveTo(

        flechaX,

        flechaY

      );


      ctx.lineTo(

        flechaX -
        punta *
        Math.cos(
          angulo -
          Math.PI / 6
        ),

        flechaY -
        punta *
        Math.sin(
          angulo -
          Math.PI / 6
        )

      );


      ctx.lineTo(

        flechaX -
        punta *
        Math.cos(
          angulo +
          Math.PI / 6
        ),

        flechaY -
        punta *
        Math.sin(
          angulo +
          Math.PI / 6
        )

      );


      ctx.closePath();


      ctx.fillStyle =
        "#00ff00";


      ctx.fill();


      ctx.strokeStyle =
        "#000000";


      ctx.lineWidth =
        Math.max(
          3,
          4 *
          factor *
          flechaEscala
        );


      ctx.stroke();

    };


  imagen.src =
    fotoBase;

}

/*====================================================
 SENSORES PARA PLOMADO
====================================================*/

async function iniciarSensores(){

  try{

    if(
      typeof DeviceMotionEvent !==
        "undefined" &&

      typeof DeviceMotionEvent
        .requestPermission ===
        "function"
    ){

      const permiso =
        await DeviceMotionEvent
          .requestPermission();


      if(
        permiso !==
        "granted"
      ){

        throw new Error(
          "Permiso de sensores rechazado."
        );

      }

    }


    window.addEventListener(
      "devicemotion",
      manejarDeviceMotion,
      true
    );


    window.addEventListener(
      "deviceorientation",
      manejarDeviceOrientation,
      true
    );


    sensoresActivos =
      true;


    actualizarPlomado();

  }
  catch(error){

    console.error(
      "ERROR SENSORES:",
      error
    );


    status.textContent =
      "No se pudieron activar los sensores del teléfono.\n\n" +
      error.message;

  }

}



function manejarDeviceMotion(
  event
){

  if(
    !event.accelerationIncludingGravity
  ){

    return;

  }


  const a =
    event.accelerationIncludingGravity;


  if(
    a.x == null ||
    a.y == null ||
    a.z == null
  ){

    return;

  }


  gravity.x =
    a.x;


  gravity.y =
    a.y;


  gravity.z =
    a.z;


  if(
    modo === "plomado" &&
    plomadoActivo
  ){

    actualizarPlomado();

  }

}



function manejarDeviceOrientation(
  event
){

  if(!event){

    return;

  }


  if(
    modo === "plomado" &&
    plomadoActivo
  ){

    actualizarPlomado();

  }

}



/*====================================================
 AJUSTAR GRAVEDAD SEGÚN ORIENTACIÓN
====================================================*/

function screenGravity(){

  const angle =
    window.screen.orientation &&
    typeof window.screen.orientation.angle ===
      "number"

      ? window.screen.orientation.angle

      : 0;


  const x =
    gravity.x;


  const y =
    gravity.y;


  if(angle === 90){

    return {

      x:y,

      y:-x

    };

  }


  if(angle === 180){

    return {

      x:-x,

      y:-y

    };

  }


  if(angle === 270){

    return {

      x:-y,

      y:x

    };

  }


  return {

    x:x,

    y:y

  };

}



/*====================================================
 CALCULAR ÁNGULO PLOMADO
====================================================*/

function calcularAnguloPendulo(){

  const g =
    screenGravity();


  const angulo =
    Math.atan2(
      g.x,
      -g.y
    ) *
    180 /
    Math.PI;


  return angulo;

}



/*====================================================
 DIBUJAR TRANSPORTADOR PLOMADO
====================================================*/

function dibujarPlomadoGrafico(){

  const canvas =
    plomadoCanvas;


  if(!canvas){

    return;

  }


  const ancho =
    700;


  const alto =
    500;


  canvas.width =
    ancho;


  canvas.height =
    alto;


  const ctx =
    canvas.getContext("2d");


  ctx.clearRect(
    0,
    0,
    ancho,
    alto
  );


  const cx =
    ancho / 2;


  const cy =
    alto - 80;


  const radio =
    250;


  ctx.fillStyle =
    "rgba(20,20,20,.95)";


  ctx.fillRect(
    0,
    0,
    ancho,
    alto
  );


  /*==================================================
    ARCO
  ==================================================*/

  ctx.beginPath();


  ctx.arc(
    cx,
    cy,
    radio,
    Math.PI,
    2 * Math.PI
  );


  ctx.strokeStyle =
    "white";


  ctx.lineWidth =
    3;


  ctx.stroke();


  /*==================================================
    MARCAS
  ==================================================*/

  for(
    let grados = -90;
    grados <= 90;
    grados += 10
  ){

    const rad =
      grados *
      Math.PI /
      180;


    const x1 =
      cx +
      Math.sin(rad) *
      radio;


    const y1 =
      cy -
      Math.cos(rad) *
      radio;


    const longitud =
      grados % 30 === 0
        ? 25
        : 12;


    const x2 =
      cx +
      Math.sin(rad) *
      (
        radio -
        longitud
      );


    const y2 =
      cy -
      Math.cos(rad) *
      (
        radio -
        longitud
      );


    ctx.beginPath();


    ctx.moveTo(
      x1,
      y1
    );


    ctx.lineTo(
      x2,
      y2
    );


    ctx.strokeStyle =
      "white";


    ctx.lineWidth =
      2;


    ctx.stroke();


    if(
      grados % 30 === 0
    ){

      ctx.fillStyle =
        "white";


      ctx.font =
        "18px Arial";


      ctx.textAlign =
        "center";


      const tx =
        cx +
        Math.sin(rad) *
        (
          radio -
          45
        );


      const ty =
        cy -
        Math.cos(rad) *
        (
          radio -
          45
        );


      ctx.fillText(
        Math.abs(grados).toString(),
        tx,
        ty
      );

    }

  }


  /*==================================================
    VERTICAL DE REFERENCIA
  ==================================================*/

  ctx.beginPath();


  ctx.moveTo(
    cx,
    cy
  );


  ctx.lineTo(
    cx,
    cy - radio
  );


  ctx.strokeStyle =
    "lime";


  ctx.lineWidth =
    5;


  ctx.stroke();


  /*==================================================
    PÉNDULO
  ==================================================*/

  const grados =
    plomadoGrados;


  const rad =
    grados *
    Math.PI /
    180;


  const largo =
    radio -
    30;


  const px =
    cx +
    Math.sin(rad) *
    largo;


  const py =
    cy -
    Math.cos(rad) *
    largo;


  ctx.beginPath();


  ctx.moveTo(
    cx,
    cy
  );


  ctx.lineTo(
    px,
    py
  );


  ctx.strokeStyle =
    "red";


  ctx.lineWidth =
    8;


  ctx.stroke();


  /*==================================================
    PESO
  ==================================================*/

  ctx.beginPath();


  ctx.arc(
    px,
    py,
    15,
    0,
    Math.PI * 2
  );


  ctx.fillStyle =
    "red";


  ctx.fill();


  /*==================================================
    CENTRO
  ==================================================*/

  ctx.beginPath();


  ctx.arc(
    cx,
    cy,
    10,
    0,
    Math.PI * 2
  );


  ctx.fillStyle =
    "white";


  ctx.fill();

}

/*====================================================
 DIBUJAR PLOMADO SOBRE FOTO
====================================================*/

function dibujarPlomadoEnFoto(
  ctx,
  width,
  height
){

  const grados =
    Math.abs(
      plomadoGrados
    );


  const direccion =
    Math.abs(
      plomadoGrados
    ) < 0.005

      ? "CENTRADO"

      : plomadoGrados > 0

        ? "DERECHA"

        : "IZQUIERDA";


  const cx =
    width *
    0.50;


  const cy =
    height *
    0.82;


  const radio =
    Math.min(
      width,
      height
    ) *
    0.18;


  const rad =
    plomadoGrados *
    Math.PI /
    180;


  /*==================================================
    FONDO
  ==================================================*/

  ctx.fillStyle =
    "rgba(0,0,0,.55)";


  ctx.beginPath();


  ctx.arc(
    cx,
    cy,
    radio + 35,
    Math.PI,
    2 * Math.PI
  );


  ctx.fill();


  /*==================================================
    TRANSPORTADOR
  ==================================================*/

  ctx.beginPath();


  ctx.arc(
    cx,
    cy,
    radio,
    Math.PI,
    2 * Math.PI
  );


  ctx.strokeStyle =
    "white";


  ctx.lineWidth =
    Math.max(
      3,
      width / 600
    );


  ctx.stroke();


  /*==================================================
    VERTICAL
  ==================================================*/

  ctx.beginPath();


  ctx.moveTo(
    cx,
    cy
  );


  ctx.lineTo(
    cx,
    cy - radio
  );


  ctx.strokeStyle =
    "lime";


  ctx.lineWidth =
    Math.max(
      4,
      width / 450
    );


  ctx.stroke();


  /*==================================================
    PÉNDULO
  ==================================================*/

  const px =
    cx +
    Math.sin(rad) *
    radio;


  const py =
    cy -
    Math.cos(rad) *
    radio;


  ctx.beginPath();


  ctx.moveTo(
    cx,
    cy
  );


  ctx.lineTo(
    px,
    py
  );


  ctx.strokeStyle =
    "red";


  ctx.lineWidth =
    Math.max(
      5,
      width / 350
    );


  ctx.stroke();


  /*==================================================
    PESO
  ==================================================*/

  ctx.beginPath();


  ctx.arc(
    px,
    py,
    Math.max(
      10,
      width / 100
    ),
    0,
    Math.PI * 2
  );


  ctx.fillStyle =
    "red";


  ctx.fill();


  /*==================================================
    TEXTO
  ==================================================*/

  ctx.fillStyle =
    "white";


  ctx.font =
    "bold " +
    Math.max(
      24,
      width / 35
    ) +
    "px Arial";


  ctx.textAlign =
    "center";


  ctx.fillText(
    grados.toFixed(2) +
    "°",
    cx,
    cy + 45
  );


  ctx.font =
    "bold " +
    Math.max(
      18,
      width / 50
    ) +
    "px Arial";


  ctx.fillText(
    direccion,
    cx,
    cy + 75
  );

}

/*====================================================
 OBTENER PUNTO MEDICIÓN
====================================================*/

function puntoMedicion(
  event
){

  const rect =
    medicionCanvas.getBoundingClientRect();


  const escalaX =
    medicionCanvas.width /
    rect.width;


  const escalaY =
    medicionCanvas.height /
    rect.height;


  return {

    x:
      (
        event.clientX -
        rect.left
      ) *
      escalaX,

    y:
      (
        event.clientY -
        rect.top
      ) *
      escalaY

  };

}

/*====================================================
 DISTANCIA
====================================================*/

function distancia(
  a,
  b
){

  if(
    !a ||
    !b
  ){

    return 0;

  }


  return Math.hypot(

    b.x -
    a.x,

    b.y -
    a.y

  );

}



/*====================================================
 DIBUJAR EDITOR MEDICIÓN
====================================================*/

function dibujarEditorMedicion(){

  if(!fotoBase){

    return;

  }


  const imagen =
    new Image();


  imagen.onload =
    function(){

      const ctx =
        medicionCanvas.getContext(
          "2d"
        );


      ctx.clearRect(

        0,
        0,

        medicionCanvas.width,
        medicionCanvas.height

      );


      ctx.drawImage(

        imagen,

        0,
        0,

        medicionCanvas.width,
        medicionCanvas.height

      );


      if(
        measurePoints.r1 &&
        measurePoints.r2
      ){

        dibujarLineaMedicion(

          ctx,

          measurePoints.r1,

          measurePoints.r2

        );

      }


      if(
        measurePoints.base &&
        measurePoints.punta
      ){

        dibujarLineaMedicion(

          ctx,

          measurePoints.base,

          measurePoints.punta

        );

      }


      dibujarPuntoCanvas(

        ctx,

        measurePoints.r1,

        "R1"

      );


      dibujarPuntoCanvas(

        ctx,

        measurePoints.r2,

        "R2"

      );


      dibujarPuntoCanvas(

        ctx,

        measurePoints.base,

        "BASE"

      );


      dibujarPuntoCanvas(

        ctx,

        measurePoints.punta,

        "PUNTA"

      );

    };

    fotoBase;

}



/*====================================================
 LÍNEA MEDICIÓN
====================================================*/

function dibujarLineaMedicion(
  ctx,
  a,
  b
){

  ctx.beginPath();


  ctx.moveTo(
    a.x,
    a.y
  );


  ctx.lineTo(
    b.x,
    b.y
  );


  ctx.strokeStyle =
    "yellow";


  ctx.lineWidth =
    8;


  ctx.stroke();

}



/*====================================================
 PUNTO MEDICIÓN
====================================================*/

function dibujarPuntoCanvas(
  ctx,
  punto,
  texto
){

  if(!punto){

    return;

  }


  ctx.beginPath();


  ctx.arc(
    punto.x,
    punto.y,
    18,
    0,
    Math.PI * 2
  );


  ctx.fillStyle =
    "red";


  ctx.fill();


  ctx.strokeStyle =
    "white";


  ctx.lineWidth =
    4;


  ctx.stroke();


  ctx.fillStyle =
    "white";


  ctx.font =
    "bold 24px Arial";


  ctx.textAlign =
    "center";


  ctx.textBaseline =
    "alphabetic";


  ctx.fillText(
    texto,
    punto.x,
    punto.y - 28
  );

}



/*====================================================
 CALCULAR MEDICIÓN
====================================================*/

function calcularMedicion(){

  const p =
    measurePoints;


  if(
    !p.r1 ||
    !p.r2 ||
    !p.base ||
    !p.punta
  ){

    alert(
      "Faltan puntos para calcular la medición."
    );


    return null;

  }


  if(
    !referenceReal ||
    referenceReal <= 0
  ){

    alert(
      "La medida real de referencia no es válida."
    );


    return null;

  }


  const referenciaPx =
    distancia(
      p.r1,
      p.r2
    );


  const postePx =
    distancia(
      p.base,
      p.punta
    );


  if(
    referenciaPx <= 0 ||
    postePx <= 0
  ){

    alert(
      "Las líneas seleccionadas no son válidas."
    );


    return null;

  }


  const metrosPorPixel =
    referenceReal /
    referenciaPx;


  const altura =
    postePx *
    metrosPorPixel;


  return {

    referenciaPx:
      referenciaPx,

    postePx:
      postePx,

    altura:
      altura

  };

}

function enviarFotoFinal(

  ahora,
  posicion,

){

    "block";

    );

    tipo:
      tipo,

    fileName:
      nombre,

      "image/jpeg",

    data:
      dataURL,

    latitud:
      posicion
        ? posicion.lat
        : null,

    longitud:
      posicion
        ? posicion.lng
        : null,

    modo:

  );

    );

  );

/*====================================================
 GPS
====================================================*/

function obtenerGPS(){

  return new Promise(
    function(resolve){

      if(
        !navigator.geolocation
      ){

        resolve(null);

        return;

      }


      navigator.geolocation.getCurrentPosition(

        function(position){

          const resultado = {

            lat:
              position.coords.latitude,

            lng:
              position.coords.longitude

          };


          gpsActual =
            resultado;


          ultimaPosicionGPS =
            resultado;


          resolve(
            resultado
          );

        },

        function(error){

          console.warn(
            "GPS ERROR:",
            error
          );


          resolve(null);

        },

        {

          enableHighAccuracy:
            true,

          timeout:
            10000,

          maximumAge:
            0

        }

      );

    }
  );

}



/*====================================================
 TIPO FOTO
====================================================*/

function obtenerNombreTipoFoto(
  tipo
){

  if(
    tipo === "poste"
  )
    return "POSTE";


  if(
    tipo === "mega"
  )
    return "CAJAS MEGA";


  if(
    tipo === "medidores"
  )
    return "MEDIDORES";


  if(
    tipo === "carriers"
  )
    return "CAJAS CARRIERS";


  if(
    String(tipo)
      .trim()
      .toUpperCase() ===
    "PLOMADO POSTE"
  )
    return "PLOMADO POSTE";


  if(
    String(tipo)
      .trim()
      .toUpperCase() ===
    "MEDIR POSTE"
  )
    return "MEDIR POSTE";


  return String(
    tipo || ""
  ).toUpperCase();

}



/*====================================================
 NOMBRE FOTO
====================================================*/

function crearNombreFoto(
  tipo,
  fecha
){

  return (

    "STAMPED_" +

    obtenerNombreTipoFoto(tipo)
      .replace(
        /\s+/g,
        "_"
      ) +

    "_" +

    formatFileDate(fecha) +

    ".jpg"

  );

}



/*====================================================
 FECHA ARCHIVO
====================================================*/

function formatFileDate(
  date
){

  const year =
    date.getFullYear();


  const month =
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const day =
    String(
      date.getDate()
    ).padStart(
      2,
      "0"
    );


  const hour =
    String(
      date.getHours()
    ).padStart(
      2,
      "0"
    );


  const minute =
    String(
      date.getMinutes()
    ).padStart(
      2,
      "0"
    );


  const second =
    String(
      date.getSeconds()
    ).padStart(
      2,
      "0"
    );


  return (

    year +
    month +
    day +
    "_" +
    hour +
    minute +
    second

  );

}



/*====================================================
 CANCELAR CÁMARA
====================================================*/

cancelButton.addEventListener(
  "click",
  function(){

    detenerCamara();


    if(
      window.opener &&
      !window.opener.closed
    ){

      window.close();

    }

  }
);



/*====================================================
 DETENER CÁMARA
====================================================*/

function detenerCamara(){

  if(stream){

    stream
      .getTracks()
      .forEach(
        function(track){

          track.stop();

        }
      );

  }


  stream =
    null;


  video.srcObject =
    null;


  takeButton.disabled =
    true;

}



/*====================================================
 INICIAR AUTOMÁTICAMENTE
====================================================*/

window.addEventListener(
  "load",
  function(){

    startButton.style.display =
      "none";


    signalButton.style.display =
      "block";


    cargarLogo();


    iniciarCamara();

  }
);

</script>
