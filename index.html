<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PETES CAMERA STAMP</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

#cameraContainer{
    position:relative;
    width:100%;
    height:100dvh;
    max-width:900px;
    margin:auto;
    background:#000;
    overflow:hidden;
}

#video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    background:#000;
}

#canvas,#workCanvas{
    display:none;
}

/* ================= HUD ================= */

#hud{
    position:absolute;
    top:0;
    left:0;
    right:0;
    z-index:20;
    padding:8px;
    pointer-events:none;
}

#modeBadge{
    display:inline-block;
    background:rgba(0,0,0,.72);
    padding:8px 10px;
    border-radius:8px;
    font-weight:bold;
    font-size:13px;
}

#sensorHud{
    margin-top:6px;
    display:inline-block;
    background:rgba(0,0,0,.62);
    padding:7px 10px;
    border-radius:8px;
    font-size:12px;
}

/* ================= PLOMADO ================= */

#plomadoOverlay{
    position:absolute;
    z-index:18;
    inset:0;
    pointer-events:none;
    display:none;
}

#plomadoCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

#plomadoReading{
    position:absolute;
    z-index:19;
    top:30%;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.72);
    border:2px solid rgba(255,255,255,.75);
    border-radius:12px;
    padding:8px 15px;
    font-size:22px;
    font-weight:bold;
    white-space:nowrap;
    text-align:center;
}

#plomadoHelp{
    position:absolute;
    z-index:19;
    top:37%;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.58);
    border-radius:8px;
    padding:6px 10px;
    font-size:12px;
    white-space:nowrap;
}

/* ================= CONTROLES ================= */

#controls{
    position:absolute;
    z-index:30;
    left:0;
    right:0;
    bottom:0;
    padding:9px 7px calc(9px + env(safe-area-inset-bottom));

    flex-wrap:wrap;
    justify-content:center;

    background:linear-gradient(transparent,rgba(0,0,0,.96));

button,input{

}

button{

    border-radius:8px;

}

#signalButton{

    color:#fff;
}

#confirmButton{
    background:#4caf50;

    display:none;
}

#cancelSignalButton{
    background:#f44336;
    color:#fff;
    display:none;

#cancelButton{

    color:#fff;

/* ================= PANEL ================= */

#specialPanel{
    position:absolute;
    z-index:40;
    left:8px;
    right:8px;
    top:76px;
    background:rgba(0,0,0,.82);

}

#specialPanel label{
    display:block;

}

#knownMeasure{
    width:100%;
    padding:10px;

    border:1px solid #777;

}

#specialHelp{
    font-size:13px;
    line-height:1.35;
}

#measureStart{
    margin-top:8px;
    background:#1565c0;

}

/* ================= EDITOR ================= */

.measureEditor{
    position:absolute;
    inset:0;
    z-index:50;
    background:#000;
    overflow:hidden;
    touch-action:none;
}

.measureCanvas{
    position:absolute;
    display:block;
    touch-action:none;

/* ================= PUNTOS ================= */

.measurePoint{
    position:absolute;
    width:34px;
    height:34px;

    border-radius:50%;
    border:3px solid #fff;

.measurePoint.base{

}

}

    z-index:60;

}

<script>
'use strict';

console.log('CAMERA STAMP: JS INICIADO');

window.addEventListener('error', function(e){
    console.error('CAMERA STAMP ERROR:', e.error || e.message);
});

window.addEventListener('unhandledrejection', function(e){
    console.error('CAMERA STAMP PROMISE ERROR:', e.reason);
});
    
/* =========================================================
   PARAMETROS
========================================================= */

const params=new URLSearchParams(location.search);

const tipo=params.get('tipo')||'poste';
let modo=params.get('modo')||'normal';

if(String(tipo).trim().toUpperCase()==='MEDIR POSTE')
    modo='medir';

if(String(tipo).trim().toUpperCase()==='PLOMADO POSTE')
    modo='plomado';

const proyecto=params.get('proyecto')||'';
const tipoProyecto=params.get('tipoProyecto')||'';
const hub=params.get('hub')||'';
const rama=params.get('rama')||'';

/* =========================================================
   LOGO
========================================================= */

const LOGO_DRIVE_ID='12EpwDn_A9mR0DfZSiGoTi2NS9zFNYPVP';

const LOGO_URL=
    'https://lh3.googleusercontent.com/d/'+LOGO_DRIVE_ID;

const LOGO_URL_ALTERNATIVO=
    'https://drive.google.com/uc?export=view&id='+LOGO_DRIVE_ID;

/* =========================================================
   DOM
========================================================= */

const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const workCanvas=document.getElementById('workCanvas');

const takeButton=document.getElementById('takeButton');
const signalButton=document.getElementById('signalButton');
const confirmButton=document.getElementById('confirmButton');
const cancelSignalButton=document.getElementById('cancelSignalButton');
const cancelButton=document.getElementById('cancelButton');

const status=document.getElementById('status');
const preview=document.getElementById('preview');
const modeBadge=document.getElementById('modeBadge');
const sensorHud=document.getElementById('sensorHud');

const specialPanel=document.getElementById('specialPanel');
const knownMeasure=document.getElementById('knownMeasure');
const specialHelp=document.getElementById('specialHelp');
const measureStart=document.getElementById('measureStart');

const plomadoOverlay=document.getElementById('plomadoOverlay');
const plomadoCanvas=document.getElementById('plomadoCanvas');
const plomadoReading=document.getElementById('plomadoReading');
const plomadoHelp=document.getElementById('plomadoHelp');

/* =========================================================
   ESTADO
========================================================= */

let cameraStream=null;
let gpsActual=null;
let fechaFoto=null;
let logoImagen=null;
let logoListo=false;
let zonaLogo=null;
let zonaEstampado=null;
let modoSenalar=false;
let fotoBase=null;

let motionHandler=null;
let orientationHandler=null;

let gravity={x:0,y:-1,z:0};
let gravityReady=false;

let plomadoGrados=0;
let plomadoActivo=false;

let referenceReal=null;

/* =========================================================
   GENERALES
========================================================= */

function setStatus(text){
    status.textContent=text;
}

function nombreTipo(t){
    if(t==='poste')return 'POSTE';
    if(t==='carriers')return 'CAJAS CARRIERS';
    return String(t).toUpperCase();
}

function formatDate(d){
    const p=n=>String(n).padStart(2,'0');

    return d.getFullYear()+
        p(d.getMonth()+1)+
        p(d.getDate())+'_'+
        p(d.getHours())+
        p(d.getMinutes())+
        p(d.getSeconds());
}

function crearNombreFoto(t,d){
    return 'STAMPED_'+
        nombreTipo(t).replace(/\s+/g,'_')+
        '_'+formatDate(d)+'.jpg';
}

function clamp(v,a,b){
    return Math.max(a,Math.min(b,v));
}

/* =========================================================
   LOGO
========================================================= */

function cargarLogo(){

    logoListo=false;
    logoImagen=new Image();
    logoImagen.crossOrigin='anonymous';

    logoImagen.onload=()=>{
        logoListo=true;
    };

    logoImagen.onerror=()=>{

        const im=new Image();
        im.crossOrigin='anonymous';

        im.onload=()=>{
            logoImagen=im;
            logoListo=true;
        };

        im.src=LOGO_URL_ALTERNATIVO;
    };

    logoImagen.src=LOGO_URL;
}

function dibujarLogo(ctx,w,h){

    zonaLogo=null;

    if(!logoListo||!logoImagen)return;

    const maxW=w*.18;
    const maxH=h*.14;

    const s=Math.min(
        maxW/logoImagen.width,
        maxH/logoImagen.height
    );

    const lw=logoImagen.width*s;
    const lh=logoImagen.height*s;

    const m=Math.max(20,w*.025);
    const x=w-lw-m;
    const y=m;
    const b=Math.max(15,w*.012);

    zonaLogo={
        x:x-b,
        y:y-b,
        width:lw+b*2,
        height:lh+b*2
    };

    ctx.save();

    ctx.fillStyle='rgba(0,0,0,.2)';
    ctx.fillRect(x-5,y-5,lw+10,lh+10);

    ctx.drawImage(
        logoImagen,
        x,y,lw,lh
    );

    ctx.restore();
}

/* =========================================================
   ESTAMPADO
========================================================= */

function dibujarEstampado(ctx,w,h,extra=[]){

    const s=Math.max(w,h)/1200;

    const pad=Math.round(16*s);
    const font=Math.max(16,Math.round(20*s));
    const line=27*s;

    const pos=gpsActual;
    const d=fechaFoto||new Date();

    const base=[
        `PROYECTO: ${proyecto||'SIN PROYECTO'}`,
        `TIPO PROYECTO: ${tipoProyecto||'SIN TIPO'}`,
        `HUB: ${hub||'-'}  RAMA: ${rama||'-'}`,
        `TIPO FOTO: ${nombreTipo(tipo)}`,
        `${d.toLocaleDateString('es-MX')}  ${d.toLocaleTimeString('es-MX')}`,
        pos
            ? `LAT: ${Number(pos.lat).toFixed(6)}  LON: ${Number(pos.lng).toFixed(6)}`
            : 'GPS: SIN UBICACIÓN',
        ...extra
    ];

    ctx.save();

    ctx.font=`bold ${font}px Arial`;
    ctx.textAlign='left';
    ctx.textBaseline='top';

    /*
       Calcular el ancho real de todas las líneas.
       Se agrega un margen adicional para evitar
       que las líneas de medición queden cortadas.
    */

    let tw=0;

    base.forEach(t=>{
        tw=Math.max(
            tw,
            ctx.measureText(t).width
        );
    });

    /*
       Ancho del recuadro.
       El texto SIEMPRE empieza exactamente
       en x + pad.
    */

    const bw=
        tw+
        pad*2;

    const bh=
        base.length*line+
        pad*2;

    /*
       Posición del estampado.
       Se mantiene pegado a la esquina inferior
       izquierda de la fotografía.
    */

    const x=pad;
    const y=h-bh-pad;

    zonaEstampado={
        x:x-18,
        y:y-18,
        width:bw+36,
        height:bh+36
    };

    /*
       Fondo
    */

    ctx.fillStyle='rgba(0,0,0,.48)';

    ctx.beginPath();

    ctx.roundRect(
        x,
        y,
        bw,
        bh,
        10*s
    );

    ctx.fill();

    /*
       Texto.
       Todas las líneas utilizan exactamente
       la misma coordenada inicial.
    */

    ctx.fillStyle='rgba(255,255,255,.96)';

    base.forEach((t,i)=>{

        ctx.fillText(
            t,
            x+pad,
            y+pad+i*line
        );

    });

    /*
       Logo
    */

    dibujarLogo(ctx,w,h);

    ctx.restore();
}

/* =========================================================
   SENSORES
========================================================= */

async function iniciarSensores(){

    try{

        if(
            typeof DeviceMotionEvent!=='undefined' &&
            typeof DeviceMotionEvent.requestPermission==='function'
        ){

            const p=await DeviceMotionEvent.requestPermission();

            if(p!=='granted')
                throw new Error('Permiso de movimiento no concedido');
        }

        motionHandler=e=>{

            const a=
                e.accelerationIncludingGravity||
                e.acceleration||{};

            if(Number.isFinite(a.x)&&Number.isFinite(a.y)){

                gravity={
                    x:a.x,
                    y:a.y,
                    z:a.z||0
                };

                gravityReady=true;
                actualizarPlomado();
            }
        };

        window.addEventListener(
            'devicemotion',
            motionHandler,
            {passive:true}
        );

        if(
            typeof DeviceOrientationEvent!=='undefined' &&
            typeof DeviceOrientationEvent.requestPermission==='function'
        ){

            const p=await DeviceOrientationEvent.requestPermission();

            if(p!=='granted')
                throw new Error('Permiso de orientación no concedido');
        }

        orientationHandler=()=>{
            actualizarPlomado();
        };

        window.addEventListener(
            'deviceorientation',
            orientationHandler,
            {passive:true}
        );

        sensorHud.textContent='Sensores: ACTIVOS';

    }catch(e){

        sensorHud.textContent='Sensores: no disponibles';
        console.warn(e);
    }
}

/* =========================================================
   GRAVEDAD SEGUN ORIENTACION
========================================================= */

function screenGravity(){

    let x=gravity.x;
    let y=gravity.y;

    const a=(
        (
            screen.orientation &&
            screen.orientation.angle
        )||0
    )%360;

    if(a===90){

        const q=x;
        x=y;
        y=-q;

    }else if(a===180){

        x=-x;
        y=-y;

    }else if(a===270){

        const q=x;
        x=-y;
        y=q;
    }

    return{x,y};
}

/* =========================================================
   ANGULO PENDULO
========================================================= */

function calcularAnguloPendulo(){

    const g=screenGravity();

    if(
        !Number.isFinite(g.x)||
        !Number.isFinite(g.y)
    ){
        return 0;
    }

    const magnitude=Math.hypot(g.x,g.y);

    if(magnitude<0.1)
        return 0;

    let ang=
        Math.atan2(
            g.x,
            g.y
        )*
        180/
        Math.PI;

    while(ang>180)
        ang-=360;

    while(ang<-180)
        ang+=360;

    if(ang>90)
        ang-=180;

    if(ang<-90)
        ang+=180;

    return clamp(
        ang,
        -90,
        90
    );
}

/* =========================================================
   TRANSPORTADOR EN PANTALLA
========================================================= */

function dibujarTransportador(){

    const w=plomadoOverlay.clientWidth;
    const h=plomadoOverlay.clientHeight;

    if(!w||!h)return;

    const dpr=window.devicePixelRatio||1;

    const rw=Math.round(w*dpr);
    const rh=Math.round(h*dpr);

    if(
        plomadoCanvas.width!==rw||
        plomadoCanvas.height!==rh
    ){

        plomadoCanvas.width=rw;
        plomadoCanvas.height=rh;
    }

    const c=plomadoCanvas.getContext('2d');

    c.setTransform(dpr,0,0,dpr,0,0);
    c.clearRect(0,0,w,h);

    dibujarPlomadoGrafico(
        c,
        w,
        h,
        true
    );
}

/* =========================================================
   GRAFICO PLOMADO
   Se usa tanto en pantalla como en la foto final.
========================================================= */

function dibujarPlomadoGrafico(c,w,h,conTexto){

    const cx=w/2;
    const cy=Math.max(90,h*.16);

    const radius=Math.min(
        w*.44,
        h*.34
    );

    c.save();

    /*
       SEMICIRCULO
       parte plana arriba
       arco hacia abajo
    */

    c.beginPath();

    for(let i=0;i<=180;i++){

        const deg=-90+i;
        const rad=deg*Math.PI/180;

        const x=
            cx+
            radius*Math.sin(rad);

        const y=
            cy+
            radius*Math.cos(rad);

        if(i===0)
            c.moveTo(x,y);
        else
            c.lineTo(x,y);
    }

    c.strokeStyle='rgba(255,255,255,.92)';
    c.lineWidth=3;
    c.stroke();

    /*
       MARCAS
    */

    for(let deg=-90;deg<=90;deg++){

        const rad=deg*Math.PI/180;

        const x1=
            cx+
            radius*Math.sin(rad);

        const y1=
            cy+
            radius*Math.cos(rad);

        let largo=9;

        if(deg%10===0)
            largo=27;
        else if(deg%5===0)
            largo=18;

        const x2=
            cx+
            (radius-largo)*Math.sin(rad);

        const y2=
            cy+
            (radius-largo)*Math.cos(rad);

        c.beginPath();
        c.moveTo(x1,y1);
        c.lineTo(x2,y2);

        c.strokeStyle=
            deg===0
                ? '#00ff00'
                : 'rgba(255,255,255,.88)';

        c.lineWidth=
            deg===0
                ? 4
                : deg%10===0
                    ? 3
                    : 1.5;

        c.stroke();
    }

    /*
       NUMEROS
    */

    if(conTexto){

        c.textAlign='center';
        c.textBaseline='middle';
        c.font='bold 13px Arial';

        for(let deg=-90;deg<=90;deg+=10){

            const rad=deg*Math.PI/180;
            const tr=radius-43;

            const tx=
                cx+
                tr*Math.sin(rad);

            const ty=
                cy+
                tr*Math.cos(rad);

            c.fillStyle=
                deg===0
                    ? '#00ff00'
                    : '#fff';

            c.fillText(
                `${deg}°`,
                tx,
                ty
            );
        }
    }

    /*
       PUNTO DE GIRO
    */

    c.beginPath();
    c.arc(cx,cy,9,0,Math.PI*2);
    c.fillStyle='#ff3b30';
    c.fill();

    c.strokeStyle='#fff';
    c.lineWidth=2;
    c.stroke();

    /*
       PENDULO ROJO
    */

    const ang=plomadoGrados*Math.PI/180;

    const longitud=Math.min(
        h*.52,
        w*.52
    );

    const px=
        cx+
        longitud*Math.sin(ang);

    const py=
        cy+
        longitud*Math.cos(ang);

    /*
       CONTORNO NEGRO
    */

    c.beginPath();
    c.moveTo(cx,cy);
    c.lineTo(px,py);

    c.strokeStyle='rgba(0,0,0,.85)';
    c.lineWidth=10;
    c.lineCap='round';
    c.stroke();

    /*
       PENDULO ROJO
    */

    c.beginPath();
    c.moveTo(cx,cy);
    c.lineTo(px,py);

    c.strokeStyle='#ff3030';
    c.lineWidth=5;
    c.lineCap='round';
    c.stroke();

    /*
       PESO
    */

    c.beginPath();
    c.arc(px,py,11,0,Math.PI*2);

    c.fillStyle='#ff3030';
    c.fill();

    c.strokeStyle='#fff';
    c.lineWidth=2;
    c.stroke();

    /*
       LINEA VERDE DE REFERENCIA VERTICAL
    */

    c.beginPath();

    c.moveTo(cx,cy);

    c.lineTo(
        cx,
        Math.min(h,cy+longitud)
    );

    c.strokeStyle='#00ff00';
    c.lineWidth=3;
    c.setLineDash([8,8]);
    c.stroke();
    c.setLineDash([]);

    c.restore();
}

/* =========================================================
   PLOMADO SOBRE LA FOTO
========================================================= */

function dibujarPlomadoEnFoto(ctx,w,h){

    /*
       Se dibuja exactamente el mismo gráfico
       directamente sobre el canvas de la fotografía.
    */

    dibujarPlomadoGrafico(
        ctx,
        w,
        h,
        true
    );
}

function actualizarPlomado(){

/* =========================================================
   CAMARA
========================================================= */

async function iniciarCamara(){

    try{

        if(cameraStream)
            detenerCamara();

        setStatus(
            'Solicitando permiso de cámara…'
        );

        cameraStream=
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:{ideal:'environment'},
                    width:{ideal:1920},
                    height:{ideal:1080}
                },

                audio:false
            });

        video.srcObject=cameraStream;

        await video.play();

        takeButton.disabled=false;

        cargarLogo();

        await iniciarSensores();

        configurarModo();

        setStatus(
            modo==='medir'
                ? '📏 MEDIR POSTE: escribe la medida real y después marca los puntos.'
                : modo==='plomado'
                    ? '📐 PLOMADO: alinea el poste con el péndulo.'
                    : '✅ Cámara lista.'
        );

    }catch(e){

        console.error(e);

        setStatus(
            '❌ NO FUE POSIBLE ABRIR LA CÁMARA.\n'+
            (e.name||'')+'\n'+
            (e.message||e)
        );

        takeButton.disabled=true;
    }
}

/* =========================================================
   MODO
========================================================= */

function configurarModo(){

    modeBadge.textContent=
        modo==='medir'
            ? '📏 MEDIR POSTE'
            : modo==='plomado'
                ? '📐 PLOMADO POSTE'
                : '📷 '+nombreTipo(tipo);

    signalButton.style.display=
        modo==='normal'
            ? 'inline-block'
            : 'none';

    if(modo==='medir'){

        specialPanel.style.display='block';

        specialHelp.textContent=
            'Escribe la medida real del objeto de referencia. Después pulsa CONTINUAR y toma la fotografía.';
    }

    if(modo==='plomado'){

        plomadoActivo=true;
        plomadoOverlay.style.display='block';

        dibujarTransportador();
    }
}

/* =========================================================
   GPS
========================================================= */

function obtenerGPS(){

    return new Promise(resolve=>{

        if(!navigator.geolocation)
            return resolve(null);

        navigator.geolocation.getCurrentPosition(

            p=>resolve({
                lat:p.coords.latitude,
                lng:p.coords.longitude,
                accuracy:p.coords.accuracy
            }),

            ()=>resolve(null),

            {
                enableHighAccuracy:true,
                timeout:10000,
                maximumAge:0
            }
        );
    });
}

/* =========================================================
   CAPTURA BASE
========================================================= */

function capturaBase(){

    const w=video.videoWidth;
    const h=video.videoHeight;

    if(!w||!h)
        throw new Error(
            'La cámara todavía no está lista.'
        );

    canvas.width=w;
    canvas.height=h;

    const ctx=canvas.getContext('2d');

    ctx.drawImage(
        video,
        0,0,w,h
    );

    return ctx;
}

let measureCanvas=null;
let measureCtx=null;

let measurePoints={

    r2:null,
    base:null,
    punta:null
};

let measureStep='r1';

/* =========================================================
   AJUSTE CANVAS MEDICION
========================================================= */

function ajustarCanvasMedicion(){

    if(!measureCanvas)
        return;

    const container=
        document.getElementById(
            'cameraContainer'
        );

    const cw=container.clientWidth;
    const ch=container.clientHeight;

    const iw=measureCanvas.width;
    const ih=measureCanvas.height;

    const escala=Math.min(
        cw/iw,
        ch/ih
    );

    const dw=iw*escala;
    const dh=ih*escala;

    measureCanvas.style.width=
        dw+'px';

    measureCanvas.style.height=
        dh+'px';

    measureCanvas.style.left=
        ((cw-dw)/2)+'px';

    measureCanvas.style.top=
        ((ch-dh)/2)+'px';
}

/* =========================================================
   PUNTO MEDICION
========================================================= */

function puntoMedicion(e){

    const r=
        measureCanvas.getBoundingClientRect();

    return{
        x:
            (e.clientX-r.left)*
            measureCanvas.width/
            r.width,

        y:
            (e.clientY-r.top)*
            measureCanvas.height/
            r.height
    };
}

function manejarClickMedicion(e){

    e.preventDefault();

    const p=puntoMedicion(e);

    if(measureStep==='r1'){

        measurePoints.r1=p;
        measureStep='r2';

    }else if(measureStep==='r2'){

        measurePoints.r2=p;
        measureStep='base';

    }else if(measureStep==='base'){

        measurePoints.base=p;
        measureStep='punta';

    }else if(measureStep==='punta'){

        measurePoints.punta=p;
        measureStep='done';
    }

    dibujarEditorMedicion();
    actualizarInstruccion();
}

/* =========================================================
   INSTRUCCIONES
========================================================= */

function actualizarInstruccion(){

    const el=
        document.getElementById(
            'measureInstruction'
        );

    if(!el)
        return;

    if(measureStep==='r1'){

        el.textContent=
            '📍 Toca el primer extremo del objeto de referencia: R1';

    }else if(measureStep==='r2'){

        el.textContent=
            '📍 Toca el segundo extremo del objeto de referencia: R2';

    }else if(measureStep==='base'){

        el.textContent=
            '📍 Toca la BASE del poste';

    }else if(measureStep==='punta'){

        el.textContent=
            '📍 Toca la PUNTA del poste';

    }else{

        const r=calcularMedicion();

        el.textContent=
            r
                ? `📏 ALTURA ESTIMADA: ${r.altura.toFixed(2)} m — pulsa TERMINAR para guardar`
                : 'Revisa los puntos marcados.';
    }
}

/* =========================================================
   DIBUJAR EDITOR
========================================================= */

function dibujarEditorMedicion(){

    if(!measureCanvas)
        return;

    const c=
        measureCanvas.getContext('2d');

    c.clearRect(
        0,
        0,
        measureCanvas.width,
        measureCanvas.height
    );

    const im=new Image();

    im.onload=()=>{

        c.drawImage(
            im,
            0,
            0,
            measureCanvas.width,
            measureCanvas.height
        );

        const p=measurePoints;

        if(p.r1&&p.r2){

            c.beginPath();

            c.moveTo(
                p.r1.x,
                p.r1.y
            );

            c.lineTo(
                p.r2.x,
                p.r2.y
            );

            c.strokeStyle='#ff9800';

            c.lineWidth=Math.max(
                4,
                measureCanvas.width/500
            );

            c.stroke();
        }

        if(p.base&&p.punta){

            c.beginPath();

            c.moveTo(
                p.base.x,
                p.base.y
            );

            c.lineTo(
                p.punta.x,
                p.punta.y
            );

            c.strokeStyle='#00e5ff';

            c.lineWidth=Math.max(
                4,
                measureCanvas.width/500
            );

            c.stroke();
        }

        dibujarPuntoCanvas(
            c,
            p.r1,
            '#ff9800',
            'R1'
        );

        dibujarPuntoCanvas(
            c,
            p.r2,
            '#9c27b0',
            'R2'
        );

        dibujarPuntoCanvas(
            c,
            p.base,
            '#00aaff',
            'BASE'
        );

        dibujarPuntoCanvas(
            c,
            p.punta,
            '#00c853',
            'PUNTA'
        );

        if(p.base&&p.punta){

            c.beginPath();

            c.moveTo(
                p.base.x,
                p.base.y
            );

            c.lineTo(
                p.punta.x,
                p.punta.y
            );

            c.strokeStyle='#00ff88';

            c.lineWidth=Math.max(
                3,
                measureCanvas.width/700
            );

            c.stroke();
        }
    };

    im.src=fotoBase;
}

/* =========================================================
   PUNTO CANVAS
========================================================= */

function dibujarPuntoCanvas(
    c,
    p,
    color,
    text
){

    if(!p)
        return;

    const r=Math.max(
        15,
        measureCanvas.width/80
    );

    c.beginPath();

    c.arc(
        p.x,
        p.y,
        r,
        0,
        Math.PI*2
    );

    c.fillStyle=color;
    c.fill();

    c.strokeStyle='#fff';
    c.lineWidth=3;
    c.stroke();

    c.fillStyle='#fff';

    c.font=
        `bold ${Math.max(14,r*.7)}px Arial`;

    c.textAlign='center';
    c.textBaseline='middle';

    c.fillText(
        text,
        p.x,
        p.y
    );
}

/* =========================================================
   CALCULO MEDICION
========================================================= */

function distancia(a,b){

    return Math.hypot(
        b.x-a.x,
        b.y-a.y
    );
}

function calcularMedicion(){

    const p=measurePoints;

    if(
        !p.r1||
        !p.r2||
        !p.base||
        !p.punta||
        !referenceReal
    )
        return null;

    const referenciaPx=
        distancia(
            p.r1,
            p.r2
        );

    const postePx=
        distancia(
            p.base,
            p.punta
        );

    if(
        referenciaPx<=0||
        postePx<=0
    )
        return null;

    const metrosPorPixel=
        referenceReal/referenciaPx;

    const altura=
        postePx*metrosPorPixel;

    return{
        referenciaPx,
        postePx,
        metrosPorPixel,
        altura
    };
}

/* =========================================================
   DESHACER
========================================================= */

function deshacerMedicion(){

    if(measureStep==='done'){

        measurePoints.punta=null;
        measureStep='punta';

    }else if(measureStep==='punta'){

        measurePoints.base=null;
        measureStep='base';

    }else if(measureStep==='base'){

        measurePoints.r2=null;
        measureStep='r2';

    }else if(measureStep==='r2'){

        measurePoints.r1=null;
        measureStep='r1';
    }

    dibujarEditorMedicion();
    actualizarInstruccion();
}

/* =========================================================
   FINALIZAR MEDICION
========================================================= */

function finalizarMedicion(){

    const resultado=
        calcularMedicion();

    if(!resultado){

        alert(
            'Debes marcar R1, R2, BASE y PUNTA antes de terminar.'
        );

        return;
    }

    const finalCanvas=
        document.createElement('canvas');

    finalCanvas.width=
        canvas.width;

    finalCanvas.height=
        canvas.height;

    const ctx=
        finalCanvas.getContext('2d');

    const im=new Image();

    im.onload=()=>{

        /*
           FOTO LIMPIA
        */

        ctx.drawImage(
            im,
            0,
            0,
            finalCanvas.width,
            finalCanvas.height
        );

        /*
           REFERENCIA R1-R2
        */

        ctx.beginPath();

        ctx.moveTo(
            measurePoints.r1.x,
            measurePoints.r1.y
        );

        ctx.lineTo(
            measurePoints.r2.x,
            measurePoints.r2.y
        );

        ctx.strokeStyle='#ff9800';

        ctx.lineWidth=Math.max(
            4,
            finalCanvas.width/500
        );

        ctx.stroke();

        /*
           LINEA POSTE
        */

        ctx.beginPath();

        ctx.moveTo(
            measurePoints.base.x,
            measurePoints.base.y
        );

        ctx.lineTo(
            measurePoints.punta.x,
            measurePoints.punta.y
        );

        ctx.strokeStyle='#00e5ff';

        ctx.lineWidth=Math.max(
            4,
            finalCanvas.width/500
        );

        ctx.stroke();

        /*
           PUNTOS
        */

        dibujarPuntoCanvasFinal(
            ctx,
            measurePoints.r1,
            '#ff9800',
            'R1',
            finalCanvas.width
        );

        dibujarPuntoCanvasFinal(
            ctx,
            measurePoints.r2,
            '#9c27b0',
            'R2',
            finalCanvas.width
        );

        dibujarPuntoCanvasFinal(
            ctx,
            measurePoints.base,
            '#00aaff',
            'BASE',
            finalCanvas.width
        );

        dibujarPuntoCanvasFinal(
            ctx,
            measurePoints.punta,
            '#00c853',
            'PUNTA',
            finalCanvas.width
        );

        /*
           LINEA VERDE DE ALTURA
        */

        ctx.beginPath();

        ctx.moveTo(
            measurePoints.base.x,
            measurePoints.base.y
        );

        ctx.lineTo(
            measurePoints.punta.x,
            measurePoints.punta.y
        );

        ctx.strokeStyle='#00ff88';

        ctx.lineWidth=Math.max(
            3,
            finalCanvas.width/700
        );

        ctx.stroke();

        /*
           ÚNICO ESTAMPADO DE LA FOTO DE MEDICION
        */

        dibujarEstampado(
            ctx,
            finalCanvas.width,
            finalCanvas.height,
            [
                `REFERENCIA REAL: ${referenceReal.toFixed(3)} m`,
                `REFERENCIA MEDIDA: ${resultado.referenciaPx.toFixed(1)} px`,
                `POSTE MEDIDO: ${resultado.postePx.toFixed(1)} px`,
                `ALTURA ESTIMADA: ${resultado.altura.toFixed(2)} m`
            ]
        );

        const dataURL=
            finalCanvas.toDataURL(
                'image/jpeg',
                .92
            );

        cerrarEditorMedicion();

        fotoBase=dataURL;

        enviarFotoFinal(
            dataURL,
            {
                modo:'medir',

                medicion:{
                    referenciaReal:
                        Number(
                            referenceReal.toFixed(3)
                        ),

                    referenciaPixeles:
                        Number(
                            resultado.referenciaPx.toFixed(2)
                        ),

                    postePixeles:
                        Number(
                            resultado.postePx.toFixed(2)
                        ),

                    altura:
                        Number(
                            resultado.altura.toFixed(2)
                        )
                }
            }
        );
    };

    im.src=fotoBase;
}

/* =========================================================
   PUNTO FINAL
========================================================= */

function dibujarPuntoCanvasFinal(
    c,
    p,
    color,
    text,
    w
){

    const r=Math.max(
        15,
        w/80
    );

    c.beginPath();

    c.arc(
        p.x,
        p.y,
        r,
        0,
        Math.PI*2
    );

    c.fillStyle=color;
    c.fill();

    c.strokeStyle='#fff';
    c.lineWidth=3;
    c.stroke();

    c.fillStyle='#fff';

    c.font=
        `bold ${Math.max(14,r*.7)}px Arial`;

    c.textAlign='center';
    c.textBaseline='middle';

    c.fillText(
        text,
        p.x,
        p.y
    );
}

/* =========================================================
   CERRAR EDITOR
========================================================= */

function cerrarEditorMedicion(){

    if(measureEditor){

        measureEditor.remove();
        measureEditor=null;
    }

    measureCanvas=null;
    measureCtx=null;

    measurePoints={
        r1:null,
        r2:null,
        base:null,
        punta:null
    };

    measureStep='r1';

    if(modo!=='normal')
        takeButton.style.display='inline-block';

    cancelButton.style.display='inline-block';

    if(modo==='normal')
        signalButton.style.display='inline-block';
}

/* =========================================================
   PLOMADO FINAL
========================================================= */

function confirmarPlomado(){

    plomadoOverlay.style.display='none';
    plomadoActivo=false;

    const grados=
        Math.abs(plomadoGrados);

    const direccion=
        Math.abs(plomadoGrados)<.005
            ? 'CENTRADO'
            : plomadoGrados>0
                ? 'DERECHA'
                : 'IZQUIERDA';

    /*
       CAPTURAR FOTO
    */

    const ctx=capturaBase();

    /*
       CORRECCION:
       AHORA EL TRANSPORTADOR, PENDULO
       Y LINEA VERDE SE ESTAMPAN SOBRE
       EL CANVAS REAL DE LA FOTO.
    */

    dibujarPlomadoEnFoto(
        ctx,
        canvas.width,
        canvas.height
    );

    /*
       DESPUES SE AGREGA EL ESTAMPADO
       UNA SOLA VEZ.
    */

    dibujarEstampado(
        ctx,
        canvas.width,
        canvas.height,
        [
            `PLOMADO: ${grados.toFixed(2)}°`,
            `DIRECCIÓN: ${direccion}`
        ]
    );

    fotoBase=
        canvas.toDataURL(
            'image/jpeg',
            .92
        );

    enviarFotoFinal(
        fotoBase,
        {
            modo:'plomado',

            plomado:{
                grados:Number(
                    grados.toFixed(2)
                ),

                direccion,

                anguloFirmado:Number(
                    plomadoGrados.toFixed(2)
                )
            }
        }
    );
}

    flechaEditor.appendChild(
        instruccion
    );


    /* =====================================================
       BARRA
    ===================================================== */

    const toolbar =
        document.createElement('div');

    toolbar.className =
        'measureToolbar';


    const centrar =
        document.createElement('button');

    centrar.textContent =
        '↩ CENTRAR';

    centrar.style.background =
        '#607d8b';

    centrar.style.color =
        '#fff';


    const finish =
        document.createElement('button');

    finish.textContent =
        '✅ USAR';

    finish.style.background =
        '#4caf50';

    finish.style.color =
        '#fff';


    const cancel =
        document.createElement('button');

    cancel.textContent =
        '❌ CANCELAR';

    cancel.style.background =
        '#b71c1c';

    cancel.style.color =
        '#fff';


    toolbar.appendChild(
        centrar
    );

    toolbar.appendChild(
        finish
    );

    toolbar.appendChild(
        cancel
    );

    flechaEditor.appendChild(
        toolbar
    );


    document
        .getElementById('cameraContainer')
        .appendChild(
            flechaEditor
        );


    /* =====================================================
       CARGAR FOTO
    ===================================================== */

    const im =
        new Image();

    im.onload = ()=>{

        flechaCanvas.width =
            im.naturalWidth;

        flechaCanvas.height =
            im.naturalHeight;


        ajustarCanvasFlecha();


        /* Posición inicial */

        flechaX =
            flechaCanvas.width / 2;

        flechaY =
            flechaCanvas.height / 2;

        flechaAngulo = 0;
        flechaEscala = 1;


        flechaTouch.activos.clear();


        dibujarEditorFlecha();


        /* =================================================
           POINTERS
        ================================================= */

        flechaCanvas.addEventListener(
            'pointerdown',
            flechaPointerDown
        );

        flechaCanvas.addEventListener(
            'pointermove',
            flechaPointerMove
        );

        flechaCanvas.addEventListener(
            'pointerup',
            flechaPointerUp
        );

        flechaCanvas.addEventListener(
            'pointercancel',
            flechaPointerUp
        );


        /* =================================================
           CENTRAR
        ================================================= */

        centrar.addEventListener(
            'click',
            ()=>{

                flechaX =
                    flechaCanvas.width / 2;

                flechaY =
                    flechaCanvas.height / 2;

                flechaAngulo = 0;
                flechaEscala = 1;

                flechaTouch.activos.clear();

                dibujarEditorFlecha();
            }
        );


        /* =================================================
           USAR
        ================================================= */

        finish.addEventListener(
            'click',
            finalizarFlecha
        );


        /* =================================================
           CANCELAR
        ================================================= */

        cancel.addEventListener(
            'click',
            ()=>{

                cerrarEditorFlecha();

                setStatus(
                    'Señal cancelada. Puedes tomar otra fotografía.'
                );
            }
        );
    };


    im.onerror = ()=>{

        setStatus(
            '❌ No se pudo abrir la fotografía para señalar.'
        );

        cerrarEditorFlecha();
    };


    im.src =
        fotoBase;


    takeButton.style.display =
        'none';

    signalButton.style.display =
        'none';

    cancelButton.style.display =
        'none';
}


/* =========================================================
   AJUSTAR CANVAS
========================================================= */

function ajustarCanvasFlecha(){

    if(!flechaCanvas)
        return;


    const container =
        document.getElementById(
            'cameraContainer'
        );


    const cw =
        container.clientWidth;

    const ch =
        container.clientHeight;


    const iw =
        flechaCanvas.width;

    const ih =
        flechaCanvas.height;


    const escala =
        Math.min(
            cw / iw,
            ch / ih
        );


    const dw =
        iw * escala;

    const dh =
        ih * escala;


    flechaCanvas.style.width =
        dw + 'px';

    flechaCanvas.style.height =
        dh + 'px';


    flechaCanvas.style.left =
        ((cw - dw) / 2) + 'px';

    flechaCanvas.style.top =
        ((ch - dh) / 2) + 'px';
}


/* =========================================================
   DIBUJAR EDITOR
========================================================= */

function dibujarEditorFlecha(){

    if(
        !flechaCanvas ||
        !fotoBase
    )
        return;


    const c =
        flechaCanvas.getContext('2d');


    const im =
        new Image();


    im.onload = ()=>{

        c.clearRect(
            0,
            0,
            flechaCanvas.width,
            flechaCanvas.height
        );


        c.drawImage(
            im,
            0,
            0,
            flechaCanvas.width,
            flechaCanvas.height
        );


        dibujarFlecha(
            c,
            flechaX,
            flechaY,
            flechaAngulo,
            flechaEscala,
            flechaCanvas.width
        );
    };


    im.src =
        fotoBase;
}


/* =========================================================
   DIBUJAR FLECHA
========================================================= */

function dibujarFlecha(
    c,
    x,
    y,
    angulo,
    escala,
    w
){

    const longitud =
        Math.max(
            120,
            w * .22 * escala
        );


    const ancho =
        Math.max(
            22,
            w * .035 * escala
        );


    c.save();

    c.translate(
        x,
        y
    );

    c.rotate(
        angulo
    );


    /* CONTORNO */

    c.strokeStyle =
        'rgba(0,0,0,.85)';

    c.lineWidth =
        ancho + 12;

    c.lineCap =
        'round';

    c.lineJoin =
        'round';


    c.beginPath();

    c.moveTo(
        0,
        longitud * .48
    );

    c.lineTo(
        0,
        -longitud * .40
    );

    c.stroke();


    /* CUERPO */

    c.strokeStyle =
        '#ff3030';

    c.lineWidth =
        ancho;


    c.beginPath();

    c.moveTo(
        0,
        longitud * .48
    );

    c.lineTo(
        0,
        -longitud * .40
    );

    c.stroke();


    /* PUNTA */

    c.fillStyle =
        '#ff3030';


    c.beginPath();

    c.moveTo(
        0,
        -longitud * .52
    );

    c.lineTo(
        -ancho * 1.8,
        -longitud * .20
    );

    c.lineTo(
        ancho * 1.8,
        -longitud * .20
    );

    c.closePath();

    c.fill();


    /* CONTORNO PUNTA */

    c.strokeStyle =
        'rgba(0,0,0,.85)';

    c.lineWidth = 5;

    c.stroke();


    c.restore();
}


/* =========================================================
   OBTENER DATOS DE 2 DEDOS
========================================================= */

function obtenerPuntoDosDedos(){

    const puntos = [
        ...flechaTouch.activos.values()
    ];


    if(puntos.length < 2)
        return null;


    const a =
        puntos[0];

    const b =
        puntos[1];


    const centroX =
        (a.x + b.x) / 2;

    const centroY =
        (a.y + b.y) / 2;


    const dx =
        b.x - a.x;

    const dy =
        b.y - a.y;


    const distancia =
        Math.hypot(
            dx,
            dy
        );


    const angulo =
        Math.atan2(
            dy,
            dx
        );


    return {
        centroX,
        centroY,
        distancia,
        angulo
    };
}


/* =========================================================
   POINTER DOWN
========================================================= */

function flechaPointerDown(e){

    e.preventDefault();


    try{

        flechaCanvas.setPointerCapture(
            e.pointerId
        );

    }catch(_){}


    const r =
        flechaCanvas.getBoundingClientRect();


    const x =
        (e.clientX - r.left) *
        flechaCanvas.width /
        r.width;


    const y =
        (e.clientY - r.top) *
        flechaCanvas.height /
        r.height;


    flechaTouch.activos.set(
        e.pointerId,
        {
            x,
            y
        }
    );


    /* ==============================================
       UN DEDO
    ============================================== */

    if(
        flechaTouch.activos.size === 1
    ){

        flechaTouch.xInicial =
            x;

        flechaTouch.yInicial =
            y;


        flechaTouch.flechaXInicial =
            flechaX;

        flechaTouch.flechaYInicial =
            flechaY;

        return;
    }


    /* ==============================================
       DOS DEDOS
    ============================================== */

    if(
        flechaTouch.activos.size === 2
    ){

        const p =
            obtenerPuntoDosDedos();


        if(!p)
            return;


        flechaTouch.centroX =
            p.centroX;

        flechaTouch.centroY =
            p.centroY;


        flechaTouch.distancia =
            p.distancia;

        flechaTouch.angulo =
            p.angulo;


        flechaTouch.escalaInicial =
            flechaEscala;

        flechaTouch.rotacionInicial =
            flechaAngulo;


        flechaTouch.flechaXInicial =
            flechaX;

        flechaTouch.flechaYInicial =
            flechaY;
    }
}


/* =========================================================
   POINTER MOVE
========================================================= */

function flechaPointerMove(e){

    e.preventDefault();


    if(
        !flechaTouch.activos.has(
            e.pointerId
        )
    )
        return;


    const r =
        flechaCanvas.getBoundingClientRect();


    const x =
        (e.clientX - r.left) *
        flechaCanvas.width /
        r.width;


    const y =
        (e.clientY - r.top) *
        flechaCanvas.height /
        r.height;


    flechaTouch.activos.set(
        e.pointerId,
        {
            x,
            y
        }
    );


    /* ==============================================
       UN DEDO = MOVER
    ============================================== */

    if(
        flechaTouch.activos.size === 1
    ){

        flechaX =
            flechaTouch.flechaXInicial +
            (
                x -
                flechaTouch.xInicial
            );


        flechaY =
            flechaTouch.flechaYInicial +
            (
                y -
                flechaTouch.yInicial
            );


        limitarFlecha();

        dibujarEditorFlecha();

        return;
    }


    /* ==============================================
       DOS DEDOS
       - PINZA = TAMAÑO
       - GIRO = ROTACIÓN
       - CENTRO = MOVIMIENTO
    ============================================== */

    if(
        flechaTouch.activos.size === 2
    ){

        const p =
            obtenerPuntoDosDedos();


        if(!p)
            return;


        /* ESCALA */

        const factor =
            p.distancia /
            Math.max(
                1,
                flechaTouch.distancia
            );


        flechaEscala =
            clamp(
                flechaTouch.escalaInicial *
                factor,
                .35,
                4
            );


        /* ROTACIÓN */

        let deltaAngulo =
            p.angulo -
            flechaTouch.angulo;


        /*
           Evita saltos al cruzar
           el límite -PI / PI.
        */

        if(deltaAngulo > Math.PI)
            deltaAngulo -= Math.PI * 2;

        if(deltaAngulo < -Math.PI)
            deltaAngulo += Math.PI * 2;


        flechaAngulo =
            flechaTouch.rotacionInicial +
            deltaAngulo;


        /* MOVIMIENTO */

        flechaX =
            flechaTouch.flechaXInicial +
            (
                p.centroX -
                flechaTouch.centroX
            );


        flechaY =
            flechaTouch.flechaYInicial +
            (
                p.centroY -
                flechaTouch.centroY
            );


        limitarFlecha();

        dibujarEditorFlecha();
    }
}


/* =========================================================
   POINTER UP
========================================================= */

function flechaPointerUp(e){

    e.preventDefault();


    flechaTouch.activos.delete(
        e.pointerId
    );


    /*
       Si queda un dedo, reconstruimos
       la referencia para que al continuar
       moviendo no haya salto.
    */

    if(
        flechaTouch.activos.size === 1
    ){

        const p =
            [
                ...flechaTouch.activos.values()
            ][0];


        flechaTouch.xInicial =
            p.x;

        flechaTouch.yInicial =
            p.y;


        flechaTouch.flechaXInicial =
            flechaX;

        flechaTouch.flechaYInicial =
            flechaY;
    }
}


/* =========================================================
   LIMITAR FLECHA
========================================================= */

function limitarFlecha(){

    if(!flechaCanvas)
        return;


    const margen =
        flechaCanvas.width * .03;


    flechaX =
        clamp(
            flechaX,
            margen,
            flechaCanvas.width - margen
        );


    flechaY =
        clamp(
            flechaY,
            margen,
            flechaCanvas.height - margen
        );
}


/* =========================================================
   FINALIZAR FLECHA
========================================================= */

function finalizarFlecha(){

    if(!fotoBase)
        return;


    const finalCanvas =
        document.createElement(
            'canvas'
        );


    finalCanvas.width =
        canvas.width;

    finalCanvas.height =
        canvas.height;


    const ctx =
        finalCanvas.getContext(
            '2d'
        );


    const im =
        new Image();


    im.onload = ()=>{

        /* FOTO ORIGINAL */

        ctx.drawImage(
            im,
            0,
            0,
            finalCanvas.width,
            finalCanvas.height
        );


        /* FLECHA */

        dibujarFlecha(
            ctx,
            flechaX,
            flechaY,
            flechaAngulo,
            flechaEscala,
            finalCanvas.width
        );

        const dataURL =
            finalCanvas.toDataURL(
                'image/jpeg',
                .92
            );


        cerrarEditorFlecha();


        fotoBase =
            dataURL;


        enviarFotoFinal(
            dataURL,
            {
                modo: 'normal',

                senalamiento: {

                    tipo: 'flecha',

                    x:
                        Number(
                            flechaX.toFixed(1)
                        ),

                    y:
                        Number(
                            flechaY.toFixed(1)
                        ),

                    angulo:
                        Number(
                            flechaAngulo.toFixed(4)
                        ),

                    escala:
                        Number(
                            flechaEscala.toFixed(3)
                        )
                }
            }
        );
    };


    im.onerror = ()=>{

        setStatus(
            '❌ No se pudo generar la fotografía señalada.'
        );
    };


    im.src =
        fotoBase;
}


/* =========================================================
   CERRAR EDITOR FLECHA
========================================================= */

function cerrarEditorFlecha(){

    if(flechaEditor){

        flechaEditor.remove();

        flechaEditor = null;
    }


    flechaCanvas = null;
    flechaCtx = null;


    flechaTouch.activos.clear();


    takeButton.style.display =
        'inline-block';

    cancelButton.style.display =
        'inline-block';


    if(modo === 'normal'){

        signalButton.style.display =
            'inline-block';
    }
}

    
/* =========================================================
   ENVIO
========================================================= */

function enviarFotoFinal(
    dataURL,
    extra={}
){

    if(!dataURL){

        setStatus(
            '❌ No existe una fotografía para enviar.'
        );

        return;
    }

    preview.src=dataURL;
    preview.style.display='block';

    const mensaje={

        type:'CAMERA_STAMP_PHOTO',

        tipo:String(tipo||'').trim(),

        fileName:crearNombreFoto(
            tipo,
            fechaFoto||new Date()
        ),

        mimeType:'image/jpeg',

        data:dataURL,

        latitud:
            gpsActual
                ? gpsActual.lat
                : null,

        longitud:
            gpsActual
                ? gpsActual.lng
                : null,

        modo,

        metadata:{
            proyecto,
            tipoProyecto,
            hub,
            rama,

            tipoFoto:
                nombreTipo(tipo),

            fecha:(
                fechaFoto||new Date()
            ).toISOString(),

            gps:gpsActual
        },

        ...extra
    };

    /*
       Verificar que existe
       la ventana del formulario.
    */

    const padre =
        window.opener;

    if(
        !padre ||
        padre.closed
    ){

        setStatus(
            '❌ No se encontró el formulario que abrió la cámara.'
        );

        return;
    }

    /*
       ENVIAR FOTO DIRECTAMENTE
       SIN ESPERAR CAMERA_STAMP_ACK
    */

    try{

        padre.postMessage(
            mensaje,
            '*'
        );

        setStatus(
            '📤 Fotografía enviada al formulario.'
        );

    }
    catch(e){

        console.error(
            'Error enviando fotografía:',
            e
        );

        setStatus(
            '❌ No se pudo enviar la fotografía al formulario.\n'+
            (e.message||e)
        );

        return;
    }

    /*
       La cámara se cierra inmediatamente
       después de enviar la foto.
    */

    detenerCamara();

    setTimeout(()=>{

        try{

            if(
                window.opener &&
                !window.opener.closed
            ){

                window.opener.focus();

            }

            window.close();

        }
        catch(_){}

    },300);
}

   SEÑALAR

signalButton.addEventListener(

measureStart.addEventListener(

/* =========================================================
   SALIR

/* =========================================================
   DETENER CAMARA
========================================================= */

function detenerCamara(){

    if(cameraStream){

        cameraStream
            .getTracks()
            .forEach(t=>t.stop());

        cameraStream=null;
    }

    video.srcObject=null;
    takeButton.disabled=true;

    if(motionHandler){

        window.removeEventListener(
            'devicemotion',
            motionHandler
        );

        motionHandler=null;
    }

    if(orientationHandler){

        window.removeEventListener(
            'deviceorientation',
            orientationHandler
        );

        orientationHandler=null;
    }
}

/* =========================================================
   RESIZE / ORIENTACION
========================================================= */

function actualizarInterfaz(){

    if(measureCanvas)
        ajustarCanvasMedicion();

    if(modo==='plomado')
        dibujarTransportador();
}

window.addEventListener(
    'resize',
    actualizarInterfaz
);

if(screen.orientation){

    screen.orientation.addEventListener(
        'change',
        ()=>{
            setTimeout(
                actualizarInterfaz,
                100
            );
        }
    );
}
